# Test profile — uses H2 in-memory database (no MySQL needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# schema.sql is MySQL-specific (CREATE DATABASE) and is not valid H2 syntax.
# Hibernate builds the schema for tests, so skip script-based init entirely.
spring.sql.init.mode=never

# JWT config for tests
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
