# Docker Compose version
version: '3.8'

# Services = containers that run together
services:

  # ============================================
  # MySQL Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: smartprocure-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smartprocuredb
    ports:
      - "3307:3306"   # 3307 on your machine → 3306 inside container
                       # Using 3307 so it doesn't conflict with your local MySQL
    volumes:
      - mysql_data:/var/lib/mysql   # Persist data even if container restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build: .                    # Use Dockerfile in current directory
    container_name: smartprocure-backend
    environment:
      # Override application.properties values for Docker environment
      # "mysql" here refers to the service name above — Docker networking resolves it
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartprocuredb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy   # Wait for MySQL to be ready
    restart: on-failure

  # ============================================
  # React Frontend (served by Nginx)
  # ============================================
  frontend:
    build: ./frontend           # Use Dockerfile in frontend directory
    container_name: smartprocure-frontend
    ports:
      - "80:80"                 # Access app at http://localhost
    depends_on:
      - backend                 # Start after backend is up
    restart: on-failure

# Named volume — Docker manages the storage location
volumes:
  mysql_data:
