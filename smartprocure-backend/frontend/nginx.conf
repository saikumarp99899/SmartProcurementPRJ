server {
    listen 80;
    server_name localhost;

    # Serve React static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # This is important for React Router (SPA)
        # If user directly goes to /dashboard, Nginx serves index.html
        # and React Router handles the route on client side
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Spring Boot backend
    # Frontend calls /api/users → Nginx forwards to backend:8080/api/users
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
